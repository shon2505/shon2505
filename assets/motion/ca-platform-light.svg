<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="245" viewBox="0 0 1200 245" role="img" aria-labelledby="title desc">
<title id="title">CA Firm Platform</title><desc id="desc">Operations, with an AI copilot. Conceptual animated illustration; not a product screenshot or live data.</desc>
<defs>
 <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E9E5F0"/><stop offset="1" stop-color="#F6F4F0"/></linearGradient>
 <linearGradient id="edge"><stop stop-color="#7956AA"/><stop offset="1" stop-color="#50742E"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#D6D5DF" stroke-width=".6" opacity=".4"/></pattern>
</defs>
<style>
.orbit{transform-box:fill-box;transform-origin:center;animation:spin 26s linear infinite}
.orbit-reverse{transform-box:fill-box;transform-origin:center;animation:spin 36s linear reverse infinite}
.float{animation:float 7s ease-in-out infinite}
.signal{stroke-dasharray:16 480;animation:signal 7s linear infinite}
.pulse{animation:pulse 4s ease-in-out infinite}
.scan{animation:scan 6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes signal{to{stroke-dashoffset:-496}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes scan{0%,100%{opacity:.25}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.orbit,.orbit-reverse,.float,.signal,.pulse,.scan{animation:none!important}}
</style>
<rect x="1" y="1" width="1198" height="243" rx="24" fill="#F6F4F0" stroke="#D6D5DF"/>
